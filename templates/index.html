<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceCalc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Light Mode - Ultra Premium */
      --bg-from: #f0f2f5;
      --bg-to: #dfe3eb;
      --surface: rgba(255, 255, 255, 0.75);
      --surface2: rgba(255, 255, 255, 0.9);
      --border: rgba(255, 255, 255, 0.5);
      --shadow: rgba(0, 0, 0, 0.05);
      --shadow-strong: rgba(0, 0, 0, 0.1);
      
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent2: #8b5cf6;
      
      --text: #0f172a;
      --text-dim: #64748b;
      
      --green: #10b981;
      --red: #ef4444;
      
      --btn-num-bg: rgba(255, 255, 255, 0.8);
      --btn-num-hover: rgba(255, 255, 255, 1);
      --btn-op-bg: rgba(235, 240, 255, 0.8);
      --btn-op-hover: rgba(219, 230, 255, 1);
      --btn-sci-bg: rgba(241, 245, 249, 0.8);
      --btn-sci-hover: rgba(226, 232, 240, 1);
      --btn-eq-bg: #2563eb;
      --btn-eq-text: #ffffff;
      --btn-eq-hover: #1d4ed8;
      
      --btn-clear-bg: rgba(254, 226, 226, 0.8);
      --btn-clear-text: #ef4444;
      --btn-clear-hover: rgba(254, 202, 202, 1);
      
      --btn-action-bg: rgba(224, 231, 255, 0.8);
      --btn-action-hover: rgba(199, 210, 254, 1);
    }

    html.dark-mode {
      color-scheme: dark;
      /* Dark Mode - Deep Space */
      --bg-from: #09090b;
      --bg-to: #18181b;
      --surface: rgba(39, 39, 42, 0.6);
      --surface2: rgba(39, 39, 42, 0.85);
      --border: rgba(255, 255, 255, 0.05);
      --shadow: rgba(0, 0, 0, 0.3);
      --shadow-strong: rgba(0, 0, 0, 0.5);
      
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent2: #a78bfa;
      
      --text: #f8fafc;
      --text-dim: #94a3b8;
      
      --green: #34d399;
      --red: #fb7185;
      
      --btn-num-bg: rgba(63, 63, 70, 0.5);
      --btn-num-hover: rgba(82, 82, 91, 0.8);
      --btn-op-bg: rgba(59, 130, 246, 0.15);
      --btn-op-hover: rgba(59, 130, 246, 0.25);
      --btn-sci-bg: rgba(39, 39, 42, 0.7);
      --btn-sci-hover: rgba(63, 63, 70, 0.9);
      --btn-eq-bg: #3b82f6;
      --btn-eq-text: #ffffff;
      --btn-eq-hover: #2563eb;
      
      --btn-clear-bg: rgba(225, 29, 72, 0.15);
      --btn-clear-text: #fb7185;
      --btn-clear-hover: rgba(225, 29, 72, 0.25);
      
      --btn-action-bg: rgba(139, 92, 246, 0.15);
      --btn-action-hover: rgba(139, 92, 246, 0.25);
    }

    body {
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-to) 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: -0.04em;
      color: var(--text);
      display: inline-block;
      text-shadow: 0 2px 10px var(--shadow);
    }

    header h1 span {
      color: var(--accent);
    }

    /* Card */
    .calc {
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 
        0 10px 30px var(--shadow),
        0 20px 60px var(--shadow-strong),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    /* Display */
    .display {
      padding: 40px 28px 28px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: transparent;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .expr-line {
      font-size: 1.1rem;
      color: var(--text-dim);
      min-height: 24px;
      word-break: break-all;
      transition: color 0.2s;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .expr-line.error {
      color: var(--red);
    }

    .result-line {
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      word-break: break-all;
      line-height: 1.1;
      margin-top: 8px;
      color: var(--text);
      transition: opacity 0.15s, transform 0.15s, color 0.4s ease;
    }

    /* Voice bar */
    .voice-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      transition: background 0.4s ease;
    }

    .voice-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .voice-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.4);
    }

    .voice-btn:active {
      transform: translateY(0) scale(0.95);
    }

    .voice-btn.listening {
      background: linear-gradient(135deg, var(--accent2) 0%, #6d28d9 100%);
      animation: mic-pulse 1.5s ease-out infinite;
    }

    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6); }
      70% { box-shadow: 0 0 0 20px rgba(139, 92, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
    }

    .voice-text {
      flex: 1;
      font-size: 0.95rem;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .voice-text.active { color: var(--accent2); }
    .voice-text.success { color: var(--green); }
    .voice-text.error { color: var(--red); }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      transition: background 0.4s ease;
    }

    .toolbar-btn {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 100px;
      border: 1px solid transparent;
      background: var(--btn-num-bg);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px var(--shadow);
    }

    .toolbar-btn:hover {
      color: var(--accent);
      background: var(--btn-num-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px var(--shadow);
    }

    .toolbar-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    /* History */
    .history-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: var(--surface2);
    }

    .history-panel.open {
      max-height: 180px;
      border-bottom: 1px solid var(--border);
    }

    .history-inner {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 180px;
    }

    .history-item {
      font-size: 0.9rem;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: center;
      transition: all 0.2s;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
    }

    .history-item:hover {
      background: var(--btn-op-bg);
      border-color: var(--border);
      transform: translateX(4px);
    }

    .history-item .h-expr { color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .h-eq { color: var(--text-dim); }
    .history-item .h-res { color: var(--text); font-weight: 600; }

    /* Button grid */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: var(--surface2);
      padding: 24px;
      transition: background 0.4s ease;
    }

    .btn {
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      height: 64px;
      border-radius: 20px;
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text);
      background: var(--btn-num-bg);
      box-shadow: 0 4px 10px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: var(--btn-num-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px var(--shadow-strong);
    }

    .btn:active {
      transform: translateY(2px) scale(0.96);
      box-shadow: 0 2px 4px var(--shadow);
    }

    .btn.op { background: var(--btn-op-bg); color: var(--accent); font-size: 1.4rem; }
    .btn.op:hover { background: var(--btn-op-hover); }

    .btn.sci { background: var(--btn-sci-bg); font-size: 1.05rem; font-weight: 500; }
    .btn.sci:hover { background: var(--btn-sci-hover); }

    .btn.action { background: var(--btn-action-bg); color: var(--accent2); font-size: 1.1rem; }
    .btn.action:hover { background: var(--btn-action-hover); }

    .btn.clear { background: var(--btn-clear-bg); color: var(--btn-clear-text); }
    .btn.clear:hover { background: var(--btn-clear-hover); }

    .btn.equals { background: var(--btn-eq-bg); color: var(--btn-eq-text); font-size: 1.5rem; border: none; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3); }
    .btn.equals:hover { background: var(--btn-eq-hover); box-shadow: 0 10px 24px rgba(37, 99, 235, 0.4); }

    .btn.span2 { grid-column: span 2; border-radius: 24px; }
    
    .no-voice-notice {
      display: none;
      padding: 10px 16px;
      font-size: 0.82rem;
      color: var(--red);
      text-align: center;
      background: rgba(248, 84, 98, 0.08);
      border-bottom: 1px solid var(--border);
      font-family: inherit;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <header>
      <h1 id="themeToggle" title="Toggle dark mode" style="cursor: pointer; user-select: none; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">Voice<span>Calc</span></h1>
    </header>

    <div class="calc">

      <!-- Display -->
      <div class="display">
        <div class="expr-line" id="exprEl"></div>
        <div class="result-line" id="resultEl">0</div>
      </div>

      <!-- Voice bar -->
      <div class="voice-bar">
        <button class="voice-btn" id="voiceBtn" title="Start voice input" aria-label="Voice input">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </button>
        <div class="voice-text" id="voiceText">Tap mic — say "five plus three"</div>
      </div>

      <div class="no-voice-notice" id="noVoiceNotice">Voice input not supported. Use Chrome or Edge.</div>

      <!-- Toolbar -->
      <div class="toolbar">
        <button class="toolbar-btn" id="sciToggle">SCI MODE</button>
        <button class="toolbar-btn" id="historyToggle">HISTORY</button>
        <button class="toolbar-btn" id="clearHistory">CLEAR HIST</button>
      </div>

      <!-- History panel -->
      <div class="history-panel" id="historyPanel">
        <div class="history-inner" id="historyInner">
          <div class="history-empty">No history yet.</div>
        </div>
      </div>

      <!-- Basic buttons -->
      <div class="btn-grid" id="basicGrid">
        <button class="btn action" data-action="del">DEL</button>
        <button class="btn action clear" data-action="clear">AC</button>
        <button class="btn action" data-action="pct">%</button>
        <button class="btn op" data-val="/">÷</button>

        <button class="btn" data-val="7">7</button>
        <button class="btn" data-val="8">8</button>
        <button class="btn" data-val="9">9</button>
        <button class="btn op" data-val="*">×</button>

        <button class="btn" data-val="4">4</button>
        <button class="btn" data-val="5">5</button>
        <button class="btn" data-val="6">6</button>
        <button class="btn op" data-val="-">−</button>

        <button class="btn" data-val="1">1</button>
        <button class="btn" data-val="2">2</button>
        <button class="btn" data-val="3">3</button>
        <button class="btn op" data-val="+">+</button>

        <button class="btn span2" data-val="0">0</button>
        <button class="btn" data-val=".">.</button>
        <button class="btn equals" data-action="eq">=</button>
      </div>

      <!-- Scientific buttons (hidden by default) -->
      <div class="btn-grid" id="sciGrid" style="display:none">
        <button class="btn action" data-action="del">DEL</button>
        <button class="btn action clear" data-action="clear">AC</button>
        <button class="btn action" data-action="pct">%</button>
        <button class="btn op" data-val="/">÷</button>

        <button class="btn sci" data-func="sin">sin</button>
        <button class="btn sci" data-func="cos">cos</button>
        <button class="btn sci" data-func="tan">tan</button>
        <button class="btn op" data-val="*">×</button>

        <button class="btn sci" data-func="log">log</button>
        <button class="btn sci" data-func="ln">ln</button>
        <button class="btn sci" data-func="sqrt">√</button>
        <button class="btn op" data-val="-">−</button>

        <button class="btn sci" data-func="abs">|x|</button>
        <button class="btn sci" data-const="pi">π</button>
        <button class="btn sci" data-const="e">e</button>
        <button class="btn op" data-val="+">+</button>

        <button class="btn" data-val="("> ( </button>
        <button class="btn" data-val=")"> ) </button>
        <button class="btn op" data-val="^">xʸ</button>
        <button class="btn equals" data-action="eq">=</button>
      </div>

    </div>
  </div>

  <script>
    const exprEl = document.getElementById('exprEl');
    const resultEl = document.getElementById('resultEl');
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceText = document.getElementById('voiceText');

    let current = '';
    let justEvaluated = false;

    // ── Display ──────────────────────────────────────────────────────────────
    function setDisplay(expr, result, isError = false) {
      exprEl.textContent = expr;
      exprEl.className = 'expr-line' + (isError ? ' error' : '');
      resultEl.textContent = result;
      resultEl.classList.remove('flash');
      void resultEl.offsetWidth; // reflow to restart animation
      resultEl.classList.add('flash');
    }

    // ── Input ─────────────────────────────────────────────────────────────────
    function append(val) {
      const isOperator = '+-*/^'.includes(val);
      if (justEvaluated) {
        // After a result: operator continues from result, digit starts fresh
        if (!isOperator) current = '';
        justEvaluated = false;
      }
      current += val;
      setDisplay(current, current || '0');
    }

    function appendFunc(fn) {
      if (justEvaluated) { current = ''; justEvaluated = false; }
      current += fn + '(';
      setDisplay(current, current || '0');
    }

    function appendConst(c) {
      if (justEvaluated) { current = ''; justEvaluated = false; }
      current += c;
      setDisplay(current, current || '0');
    }

    // ── Calculate ─────────────────────────────────────────────────────────────
    async function calculate() {
      if (!current) return;
      const expr = current;
      try {
        const res = await fetch('/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expression: expr })
        });
        const data = await res.json();
        if (data.error) {
          setDisplay(expr, data.error, true);
          current = '';
        } else {
          setDisplay(expr + ' =', String(data.result));
          current = String(data.result);
          justEvaluated = true;
          addHistory(expr, data.result);
        }
      } catch {
        setDisplay(expr, 'Connection error', true);
      }
    }

    // ── History ───────────────────────────────────────────────────────────────
    let history = [];
    try { history = JSON.parse(localStorage.getItem('vcHistory') || '[]'); } catch { }

    const historyInner = document.getElementById('historyInner');
    const historyPanel = document.getElementById('historyPanel');
    const historyToggle = document.getElementById('historyToggle');
    const clearHistBtn = document.getElementById('clearHistory');

    function renderHistory() {
      if (!history.length) {
        historyInner.innerHTML = '<div class="history-empty">No history yet.</div>';
        return;
      }
      historyInner.innerHTML = '';
      history.forEach((h, i) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML =
          `<span class="h-expr">${escHtml(String(h.expr))}</span>` +
          `<span class="h-eq">=</span>` +
          `<span class="h-res">${escHtml(String(h.result))}</span>`;
        item.addEventListener('click', () => {
          current = String(h.result);
          justEvaluated = true;
          setDisplay(h.expr + ' =', String(h.result));
        });
        historyInner.appendChild(item);
      });
    }

    function addHistory(expr, result) {
      history.unshift({ expr, result });
      if (history.length > 20) history.length = 20;
      try { localStorage.setItem('vcHistory', JSON.stringify(history)); } catch { }
      renderHistory();
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    historyToggle.addEventListener('click', () => {
      const open = historyPanel.classList.toggle('open');
      historyToggle.classList.toggle('active', open);
    });

    clearHistBtn.addEventListener('click', () => {
      history = [];
      try { localStorage.removeItem('vcHistory'); } catch { }
      renderHistory();
    });

    renderHistory();

    // ── Sci toggle ────────────────────────────────────────────────────────────
    const sciToggle = document.getElementById('sciToggle');
    const basicGrid = document.getElementById('basicGrid');
    const sciGrid = document.getElementById('sciGrid');
    let sciMode = false;

    sciToggle.addEventListener('click', () => {
      sciMode = !sciMode;
      basicGrid.style.display = sciMode ? 'none' : 'grid';
      sciGrid.style.display = sciMode ? 'grid' : 'none';
      sciToggle.classList.toggle('active', sciMode);
    });

    // ── Button handler ────────────────────────────────────────────────────────
    function handleBtn(btn) {
      const { val, action, func } = btn.dataset;
      const c = btn.dataset.const;

      if (val !== undefined) { append(val); }
      else if (func !== undefined) { appendFunc(func); }
      else if (c !== undefined) { appendConst(c); }
      else if (action === 'eq') { calculate(); }
      else if (action === 'del') {
        current = current.slice(0, -1);
        justEvaluated = false;
        setDisplay(current, current || '0');
      }
      else if (action === 'clear') {
        current = '';
        justEvaluated = false;
        setDisplay('', '0');
      }
      else if (action === 'pct') {
        // Only apply % to a trailing number, not the whole expression
        const m = current.match(/^(.*?)(-?\d*\.?\d+)$/);
        if (m) {
          current = m[1] + String(parseFloat(m[2]) / 100);
          setDisplay(current, current);
        }
      }
    }

    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => handleBtn(btn));
    });

    // ── Keyboard ──────────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if ('0123456789.+-*/()^'.includes(e.key)) { append(e.key); }
      else if (e.key === 'Enter' || e.key === '=') { calculate(); }
      else if (e.key === 'Backspace') {
        current = current.slice(0, -1);
        justEvaluated = false;
        setDisplay(current, current || '0');
      }
      else if (e.key === 'Escape') {
        current = '';
        justEvaluated = false;
        setDisplay('', '0');
      }
    });

    // ── Voice ─────────────────────────────────────────────────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      voiceBtn.disabled = true;
      voiceBtn.style.opacity = '0.3';
      document.getElementById('noVoiceNotice').style.display = 'block';
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      let listening = false;

      recognition.onstart = () => {
        listening = true;
        voiceBtn.classList.add('listening');
        voiceText.textContent = 'Listening…';
        voiceText.className = 'voice-text active';
      };

      recognition.onresult = async (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        if (!e.results[e.results.length - 1].isFinal) {
          voiceText.textContent = transcript + '…';
          return;
        }
        voiceText.textContent = `"${transcript}"`;
        try {
          const res = await fetch('/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ transcript })
          });
          const data = await res.json();
          if (data.error) {
            voiceText.textContent = `Couldn't parse: "${transcript}"`;
            voiceText.className = 'voice-text error';
          } else {
            current = String(data.result);
            justEvaluated = true;
            setDisplay(data.expression + ' =', String(data.result));
            addHistory(data.expression, data.result);
            voiceText.textContent = `✓ ${data.expression} = ${data.result}`;
            voiceText.className = 'voice-text success';
            setTimeout(() => {
              voiceText.textContent = 'Tap mic — say "five plus three"';
              voiceText.className = 'voice-text';
            }, 3000);
          }
        } catch {
          voiceText.textContent = 'Connection error';
          voiceText.className = 'voice-text error';
        }
      };

      recognition.onerror = (e) => {
        voiceText.textContent = e.error === 'not-allowed' ? 'Mic access denied' : 'Voice error — try again';
        voiceText.className = 'voice-text error';
      };

      recognition.onend = () => {
        listening = false;
        voiceBtn.classList.remove('listening');
      };

      voiceBtn.addEventListener('click', () => {
        if (listening) recognition.stop();
        else try { recognition.start(); } catch { }
      });
    }

    // ── Dark Mode ──────────────────────────────────────────────────────────────
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;

    function updateTheme(isDark) {
      if (isDark) {
        html.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        html.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      }
    }

    // Initialize theme on page load
    function initTheme() {
      const saved = localStorage.getItem('theme');
      const isDark = saved ? saved === 'dark' :
        (window.matchMedia('(prefers-color-scheme: dark)').matches);
      updateTheme(isDark);
    }

    // Toggle theme on button click
    themeToggle.addEventListener('click', (e) => {
      e.preventDefault();
      const isDark = !html.classList.contains('dark-mode');
      updateTheme(isDark);
    });

    // Initialize on load
    initTheme();

  </script>
</body>

</html>
